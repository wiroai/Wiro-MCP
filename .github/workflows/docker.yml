name: Publish the Docker image

on:
  release:
    types: [created]

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      IMAGE: wiroai/wiro-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub gets the version npm gets: the release tag must match package.json and
      # both versions in server.json, the same check the npm workflow makes.
      - name: Check the versions match the release
        id: version
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for found in $(jq -r '.version' package.json) $(jq -r '.version, .packages[].version' server.json); do
            if [ "$found" != "$version" ]; then
              echo "::error::The release tag is $GITHUB_REF_NAME, but package.json or server.json says $found."
              exit 1
            fi
          done
          tags="$IMAGE:$version"
          if [ "$PRERELEASE" != "true" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Check the Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::The DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are not set, so the image was not published."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The image ships only code that passes the tests, as npm does.
      - name: Test
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile builds once on the runner's own platform and the arm64 image only
      # copies the result, so the arm64 build needs no emulation.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
